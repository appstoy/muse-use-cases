<script>
(function(){
  var t = null;
  try { t = localStorage.getItem('appstoy-theme'); } catch(e){}
  if (!t) { t = 'dark'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<title>Muse 实战案例库 💡 | 真实高价值玩法</title>

<style>
:root{
  /* appstoy brand palette (from appstoy.com) */
  --brand:#ff6f06;
  --brand-soft:rgba(255,111,6,.12);
  --brand-line:rgba(255,111,6,.35);
  --blue:#2997f7;
  --green:#12b928;
  --purple:#9b51e0;
}

/* ---- Dark theme (default) ---- */
:root, html[data-theme="dark"]{
  --bg:#292a2d;
  --bg-deep:#232427;
  --card:#3b3c3e;
  --card-hi:#45464a;
  --text:#e5eef7;
  --muted:#9aa3ad;
  --line:rgba(255,255,255,.09);
  --ink:#ffffff;
  --soft:rgba(255,255,255,.06);
  --shadow:0 10px 40px rgba(0,0,0,.28);
  --header-bg:rgba(41,42,45,.9);
  --filter-bg:rgba(41,42,45,.92);
  --hero-pattern:radial-gradient(rgba(255,255,255,.07) 1.3px, transparent 1.4px);
  --hero-ring:rgba(255,111,6,.14);
  --badge-ok-bg:rgba(18,185,40,.14);
  --badge-ok-color:#4ade80;
  --badge-ok-border:rgba(18,185,40,.3);
  --badge-cross-bg:rgba(255,111,6,.14);
  --badge-cross-color:#ff9a3c;
  --badge-cross-border:rgba(255,111,6,.3);
  --card-hover-shadow:0 14px 34px rgba(0,0,0,.42), 0 0 0 1px var(--brand-soft);
  --scrollbar-track:var(--bg-deep);
  --scrollbar-thumb:rgba(255,255,255,.14);
  --scrollbar-thumb-hover:rgba(255,255,255,.22);
  --img-filter:none;
  color-scheme:dark;
}

/* ---- Light theme ---- */
html[data-theme="light"]{
  --bg:#f4f5f8;
  --bg-deep:#ffffff;
  --card:#ffffff;
  --card-hi:#f7f8fa;
  --text:#181a1f;
  --muted:#64748b;
  --line:rgba(0,0,0,.08);
  --ink:#0f172a;
  --soft:rgba(0,0,0,.04);
  --shadow:0 8px 30px rgba(0,0,0,.06);
  --header-bg:rgba(255,255,255,.88);
  --filter-bg:rgba(244,245,248,.92);
  --hero-pattern:radial-gradient(rgba(0,0,0,.06) 1.3px, transparent 1.4px);
  --hero-ring:rgba(255,111,6,.16);
  --badge-ok-bg:#eaf7ee;
  --badge-ok-color:#0d8a4e;
  --badge-ok-border:#b7e6c9;
  --badge-cross-bg:#fff4ea;
  --badge-cross-color:#d96b00;
  --badge-cross-border:#fed8b2;
  --card-hover-shadow:0 14px 30px rgba(255,111,6,.14), 0 0 0 1px var(--brand-soft);
  --scrollbar-track:#eaedf1;
  --scrollbar-thumb:rgba(0,0,0,.18);
  --scrollbar-thumb-hover:rgba(0,0,0,.3);
  --img-filter:none;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
a{color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:var(--header-bg);border-bottom:1px solid var(--line)}
header.top .wrap.head-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px}
.head-right{justify-self:end;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:20px;white-space:nowrap;color:var(--ink)}
.logo small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.search{flex:1;min-width:180px;display:flex}
.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
  padding:10px 16px;font-size:15px;outline:none}
.search input:focus{border-color:var(--ink)}
.search.hidden{display:none}
.lang-select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;max-width:140px}
.gh-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.gh-btn:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.gh-btn svg{flex:none}
.site-btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);border:1px solid var(--brand);
  border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}
.site-btn:hover{background:#ff8330;border-color:#ff8330;box-shadow:0 4px 14px rgba(255,111,6,.32)}
.site-btn svg{flex:none;opacity:.95}
.tabs{display:flex;gap:10px;margin:22px 0 4px}
.tabs-head{margin:0;justify-self:center}
.tabs-head button{padding:8px 18px;font-size:14px}
.search-bar{margin:18px 0 6px}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 24px;
  font-size:15px;font-weight:700;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.hero{margin:18px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:54px 58px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;
  background-image:var(--hero-pattern);
  background-size:34px 34px;pointer-events:none}
.hero::after{content:"";position:absolute;right:-100px;top:50%;width:360px;height:360px;transform:translateY(-50%);
  border:2px solid var(--hero-ring);border-radius:50%;pointer-events:none}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:flex-start;width:100%}
.hero-main{width:100%;max-width:900px}
.hero-label{font-size:19px;letter-spacing:8px;color:var(--muted);margin-bottom:16px}
.hero-title{font-size:66px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:12px;white-space:nowrap}
.hero-sub{font-size:21px;color:var(--muted);margin-bottom:28px}
.hero-sub b{color:var(--ink)}
.hero-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero-invite{background:var(--brand);color:#fff;border:none;border-radius:999px;
  padding:15px 38px;font-size:20px;font-weight:800;cursor:pointer}
.hero-invite:hover{opacity:.88}
.hero-side{color:var(--muted);font-size:17px}

.stats{display:flex;gap:14px;flex-wrap:wrap;margin:22px 0}
.stat{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.stat b{font-size:28px;color:var(--ink);display:block}
.stat span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 20px;position:sticky;top:66px;z-index:40;
  background:var(--filter-bg);padding:12px 0;backdrop-filter:blur(10px)}
.pill{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:8px 18px;font-size:14px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--ink)}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.pill .n{opacity:.6;font-size:12px;margin-left:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:16px;padding-bottom:40px}
#grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--card-hover-shadow)}
.card h3{font-size:17px;line-height:1.45;color:var(--ink)}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;display:inline-block;width:fit-content;font-weight:600}
.badge.ok{background:#e6f7ef;color:#0e7a4f;border:1px solid #bfe8d2}
.badge.cross{background:#fdf3e0;color:#9a6b12;border:1px solid #f0dcae}
.result{color:var(--ink);font-weight:800;font-size:16px}
.author{color:var(--muted);font-size:13px}
.desc{color:var(--muted);font-size:14px;flex:1;line-height:1.6}
.xbtn{align-self:flex-start;background:var(--soft);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:7px 16px;font-size:13px;text-decoration:none;font-weight:600}
.xbtn:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}
/* sort + load more */
.sortbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.sortbar .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.sortbar button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;font-weight:600}
.sortbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.loadmore-wrap{display:flex;justify-content:center;padding:6px 0 40px}
.loadmore{background:var(--brand);color:#fff;border:none;border-radius:999px;padding:12px 34px;font-size:15px;font-weight:700;cursor:pointer}
.loadmore:hover{opacity:.88}
.icode.spent{opacity:.55}
.icode.spent:hover{transform:none;box-shadow:none}
.btn-ghost{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:12px 28px;font-weight:700;font-size:15px;cursor:pointer;margin-left:10px}
.btn-ghost.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* case media */
.card-media{width:100%;border-radius:12px;display:block;background:var(--bg-deep)}
video.card-media{background:#000;max-height:340px}
/* invite ad slots */
.invite-count{color:var(--muted);font-size:13px;margin-top:10px}
@media(max-width:640px){.invite-grid{grid-template-columns:1fr}}
/* invite codes */
.invite-head{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;margin:18px 0}
.invite-head h2{font-size:22px;color:var(--ink);margin-bottom:8px}
.invite-head p{color:var(--muted);font-size:14px}
.invite-head .note{font-size:12px;color:var(--muted);margin-top:14px}
.invite-actions{margin-top:16px}
.btn-ink{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;
  padding:12px 28px;font-weight:700;text-decoration:none;font-size:15px}
.btn-ink:hover{opacity:.88}
.invite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:6px 0 40px}
.icode{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative}
.icode:hover{transform:translateY(-3px);box-shadow:var(--card-hover-shadow)}
.icode-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icode code{font-family:ui-monospace,monospace;font-size:26px;font-weight:800;letter-spacing:2px;color:var(--ink);cursor:pointer}
.copybtn{background:var(--brand);color:#fff;border:none;border-radius:999px;padding:8px 18px;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.copybtn:hover{opacity:.85}
.owner-tag{position:absolute;top:14px;right:16px;font-size:11px;background:var(--brand);color:#fff;
  border-radius:999px;padding:3px 12px;font-weight:700}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress div{height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.icode-meta{font-size:14px;font-weight:700;color:var(--ink)}
.icode-meta small{color:var(--muted);font-weight:400}
.icode-intro{font-size:13px;color:var(--muted);flex:1}
.icode-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.icode-foot a{color:var(--muted);text-decoration:none}
.icode-foot a:hover{text-decoration:underline}
/* owner (site owner) invite showcase */
/* community codes list */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 4px}
.section-head h3{font-size:17px;color:var(--ink);margin:0}
.section-head .sub{font-size:13px;color:var(--muted);font-weight:400}
.btn-sm{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer}
.btn-sm:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.icode.random{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* submit form */
.submit-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin:22px 0 8px}
.submit-box h3{font-size:18px;color:var(--ink);margin:0 0 6px}
.submit-box p.sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.submit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:var(--ink)}
.field label span{font-weight:400;color:var(--muted)}
input.field-in,textarea.field-in{width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:14px;font-family:inherit;background:var(--bg-deep);color:var(--text);box-sizing:border-box}
input.field-in:focus,textarea.field-in:focus{outline:none;border-color:var(--brand);background:var(--card-hi)}
input.field-in.bad{border-color:#e5484d;background:rgba(229,72,77,.12)}
.submit-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.btn-submit{background:var(--brand);color:#fff;border:none;border-radius:999px;padding:13px 30px;
  font-size:15px;font-weight:800;cursor:pointer}
.btn-submit:hover{opacity:.88}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.form-msg{font-size:13px;color:var(--muted)}
.form-msg.err{color:#e5484d;font-weight:700}
.form-msg.ok{color:#12a150;font-weight:700}
footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--muted);font-size:13px;background:var(--bg-deep);margin-top:auto}
footer .wrap{display:flex;flex-direction:column;gap:10px}
.foot-brand{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot-brand a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600}
.foot-brand a:hover{color:var(--brand)}
.foot-brand img{opacity:.9}
.foot-brand .dot{opacity:.4}
body{min-height:100vh;display:flex;flex-direction:column}
.wrap.main{flex:1;min-width:0}

/* never let the page scroll horizontally */
html,body{max-width:100%;overflow-x:hidden}
img,video,pre,table{max-width:100%}


/* ---------- appstoy brand ---------- */
.logo{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none;display:block;object-fit:contain;
  filter:drop-shadow(0 3px 10px rgba(41,151,247,.35))}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2px}
@media(max-width:640px){
  .brand-mark{width:26px;height:26px}
  .brand-name{font-size:13px}
  .brand-sub{font-size:10px}
}


/* ---------- appstoy visual polish ---------- */
/* brand-tinted hero glow */
.hero{position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{background-image:var(--hero-pattern)}
.hero::after{border-color:var(--hero-ring)}
/* orange accent bar on card hover */
.card{transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease}
.card:hover{border-color:var(--brand);box-shadow:var(--card-hover-shadow)}
/* result line gets brand color */
.card .result{color:var(--brand)}
/* badges */
.badge.ok{background:var(--badge-ok-bg);color:var(--badge-ok-color);border:1px solid var(--badge-ok-border)}
.badge.cross{background:var(--badge-cross-bg);color:var(--badge-cross-color);border:1px solid var(--badge-cross-border)}
/* stats: subtle brand tint on the number */
.stat b{color:var(--brand)}
.stat{transition:border-color .18s ease}
.stat:hover{border-color:var(--brand-line)}
/* section headings */
.section-head h3{color:var(--text)}
/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--scrollbar-track)}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover)}
/* selection */
::selection{background:rgba(255,111,6,.32);color:#fff}

/* ---------- theme toggle ---------- */
html.theme-anim, html.theme-anim body, html.theme-anim header.top, html.theme-anim .card,
html.theme-anim .hero, html.theme-anim .stat, html.theme-anim footer {
  transition: background-color .22s ease, color .22s ease, border-color .22s ease;
}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--card);
  border:1px solid var(--line);border-radius:999px;width:38px;height:38px;cursor:pointer;
  color:var(--text);flex:none;padding:0}
.theme-btn:hover{border-color:var(--brand);color:var(--brand)}
.theme-btn svg{display:block;transition:transform .35s ease}
.theme-btn:active svg{transform:rotate(35deg) scale(.9)}
header.top,.card,.hero,.stat,.pill,.search input,.invite-head,.icode,.submit-box,footer,
.tabs button,.sortbar button,.gh-btn,.lang-select,.theme-btn,.xbtn,input.field-in,textarea.field-in{
  transition:background-color .22s ease, border-color .22s ease, color .22s ease, box-shadow .22s ease;
}
@media(max-width:860px){ .theme-btn{width:34px;height:34px} }

/* ========== mobile / small screens ========== */
@media(max-width:860px){
  /* header: keep logo + actions on one row, tabs on their own row */

  .logo small{display:none}
  .head-right{margin-left:auto;gap:8px}
  .gh-btn{padding:8px 12px;font-size:13px}
  .site-btn{padding:8px 12px;font-size:13px}
  .site-btn span{display:none}
  .gh-btn span{display:none}
  .lang-select{padding:8px 10px;font-size:13px;max-width:104px}
  .tabs-head{order:5;width:100%;justify-content:stretch;gap:8px}
  .tabs-head button{flex:1;padding:9px 10px;font-size:13px;text-align:center}
  .filters{top:104px}
}
@media(max-width:640px){
  .wrap{padding:0 14px;width:100%;max-width:100%;min-width:0}
  .search-bar{margin:12px 0 4px}
  .search input{font-size:16px;padding:11px 14px}   /* 16px stops iOS zoom-on-focus */

  /* hero: compact, no fixed huge type */
  .hero{padding:22px 18px;border-radius:16px;margin:12px 0 4px;max-width:100%}
  .hero-inner{flex-direction:column;align-items:stretch;gap:18px;width:100%;max-width:100%}
  .hero-label{font-size:11px;letter-spacing:3px;margin-bottom:8px}
  .hero-title{font-size:30px;line-height:1.2;margin-bottom:8px;white-space:normal;word-break:break-word}
  .hero-sub{font-size:14px;margin-bottom:16px;line-height:1.5}
  .hero-row{gap:12px}
  .hero-invite{font-size:14px;padding:11px 20px}

  /* stats: 2x2 compact grid instead of tall stacked cards */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
  .stat{min-width:0;padding:12px 14px;border-radius:13px}
  .stat b{font-size:21px}
  .stat span{font-size:11px}

  /* filters scroll horizontally instead of wrapping into many rows */
  .filters{gap:8px;margin:6px 0 14px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    min-width:0;max-width:100%;width:100%}
  .filters::-webkit-scrollbar{display:none}
  .filters .pill{flex:0 0 auto;white-space:nowrap}

  .sortbar{font-size:12px;gap:8px}
  .sortbar button{font-size:12px;padding:7px 12px}

  /* cards: single column, tighter */
  #grid{grid-template-columns:minmax(0,1fr);gap:14px;width:100%;min-width:0}
  .card{padding:16px;border-radius:14px}
  .card h3{font-size:16px;line-height:1.4}
  .card .desc{font-size:13px;line-height:1.6}
  .card .result{font-size:14px}

  $("#heroSide").textContent = T().heroSide;
}

/* ---------- cases view ---------- */
function badge(b){
  const cls = b === "ok" ? "ok" : "cross";
  const txt = b === "ok" ? T().badgeOk : T().badgeCross;
  return `<span class="badge ${cls}">${txt}</span>`;
}
function mediaHTML(c){
  if (!c.m || !c.m.length) return "";
  const it = c.m[0];
  if (it.k === "vid"){
    const poster = it.p ? ` poster="${it.p}"` : "";
    return `<video class="card-media" controls preload="metadata" playsinline${poster} src="${it.u}"></video>`;
  }
  return `<a href="${it.f || it.u}" target="_blank" rel="noopener"><img class="card-media" loading="lazy" src="${it.u}" alt=""></a>`;
}
function card(c){
  const t = lang === "zh" ? c.t : c.te;
  const a = lang === "zh" ? c.a : c.ae;
  const r = lang === "zh" ? c.r : c.re;
  const d = lang === "zh" ? c.d : c.de;
  const x = c.x ? `<a class="xbtn" href="${c.x}" target="_blank" rel="noopener">${T().viewX}</a>` : "";
  return `<article class="card"><div>${badge(c.b)}</div><h3>${t}</h3>
    ${mediaHTML(c)}
    <div class="result">${r}</div><div class="author">${a}</div>
    <p class="desc">${d}</p>${x}</article>`;
}
function renderAll(){
  renderHero();
  const counts = {};
  DATA.cases.forEach(c => counts[c.c] = (counts[c.c] || 0) + 1);
  $("#stats").innerHTML =
    `<div class="stat"><b>${DATA.meta.count}</b><span>${T().cases}</span></div>
     <div class="stat"><b>${DATA.cats.length}</b><span>${T().cats}</span></div>
     <div class="stat"><b>${DATA.cases.filter(c=>c.x).length}</b><span>${T().withX}</span></div>
     <div class="stat"><b>${DATA.meta.updated}</b><span>${T().updated}</span></div>`;
  $("#filters").innerHTML =
    `<button class="pill on" data-cat="all">${T().all}<span class="n">${DATA.cases.length}</span></button>` +
    DATA.cats.map(c => `<button class="pill" data-cat="${c.id}">${catName(c)}<span class="n">${counts[c.id]||0}</span></button>`).join("");
  document.querySelectorAll(".pill").forEach(p =>
    p.addEventListener("click", () => { activeCat = p.dataset.cat; shown = 24; render(); }));
  $("#sortbar").innerHTML =
    `<span class="lbl">${T().sortLabel}</span>` +
    `<button data-sort="new" class="${sortMode === "new" ? "on" : ""}">${T().sortNew}</button>` +
    `<button data-sort="old" class="${sortMode === "old" ? "on" : ""}">${T().sortOld}</button>` +
    `<button data-onlyx="1" class="${onlyX ? "on" : ""}">${T().onlyX}</button>`;
  document.querySelectorAll("#sortbar button[data-sort]").forEach(b =>
    b.addEventListener("click", () => { sortMode = b.dataset.sort; shown = 24; renderAll(); }));
  document.querySelectorAll("#sortbar button[data-onlyx]").forEach(b =>
    b.addEventListener("click", () => { onlyX = !onlyX; shown = 24; renderAll(); }));
  render();
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  if (q !== lastQ){ lastQ = q; shown = 24; }
  let list = DATA.cases.filter(c =>
    (activeCat === "all" || c.c === activeCat) &&
    (!onlyX || c.x) &&
    (!q || (c.t + c.te + c.a + c.ae + c.d + c.de + c.r + c.re).toLowerCase().includes(q)));
  if (sortMode === "new") list = list.slice().reverse();
  const total = list.length;
  const page = list.slice(0, shown);
  $("#grid").innerHTML = page.length ? page.map(card).join("")
    : `<div class="empty">${T().empty}</div>`;
  const more = total - shown;
  const btn = $("#loadMore");
  if (more > 0){ btn.style.display = ""; btn.textContent = T().loadMore + " · " + T().moreLeft(more); }
  else btn.style.display = "none";
  document.querySelectorAll(".pill").forEach(p =>
    p.classList.toggle("on", p.dataset.cat === activeCat));
}

/* ---------- invite codes view ---------- */
const ISSUES_API = "https://api.github.com/repos/appstoy/muse-use-cases/issues?labels=invite-code&state=open&per_page=100";
const SUBMIT_URL = "https://github.com/appstoy/muse-use-cases/issues/new";
let INVITES = [];

function parseInvite(issue){
  const body = issue.body || "";
  const mCode = body.match(/###\s*你的 Muse 邀请码\s*\n+#?\s*([A-Za-z0-9]{4,12})/)
             || issue.title.match(/\[邀请码\]\s*([A-Za-z0-9]{4,12})/)
             || issue.title.match(/(?:invite code|邀请码)[:：]\s*([A-Za-z0-9]{4,12})/i)
             || body.match(/invite code[,\s]+(?:as invited[:：]?\s*)?([A-Za-z0-9]{4,12})/i);
  const mUsed = body.match(/###\s*已使用次数\s*\n+#?\s*(\d+)/);
  const mTotal = body.match(/###\s*邀请码总名额[^\n]*\s*\n+#?\s*(\d+)/);
  const mIntro = body.match(/###\s*一句话介绍\s*\n+#?\s*([^\n#]+)/);
  return {
    code: mCode ? mCode[1].toUpperCase() : null,
    used: mUsed ? parseInt(mUsed[1], 10) : null,
    total: mTotal ? parseInt(mTotal[1], 10) : null,
    intro: mIntro ? mIntro[1].trim().replace(/^_?(None|No response)_?$/, "") : "",
    user: issue.user.login, url: issue.html_url,
    date: (issue.created_at || "").slice(0, 10)
  };
}
function remainingOf(inv){
  if (inv.used !== null && inv.total !== null) return Math.max(inv.total - inv.used, 0);
  return null;
}

/* Fisher-Yates shuffle, then take n */
function pickRandom(arr, n){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* the site owner's code — always first and largest */

function inviteCardHTML(inv){
  const meta = [];
  if (inv.used !== null && inv.total !== null && inv.total > 0){
    const left = Math.max(inv.total - inv.used, 0);
    const pct = Math.min(inv.used / inv.total * 100, 100);
    meta.push('<div class="progress"><div style="width:' + pct + '%"></div></div>');
    meta.push('<div class="icode-meta">' + T().usedWord + ' ' + inv.used + T().timesWord
      + ' · ' + T().leftWord + ' ' + left + T().timesWord + '</div>');
  } else if (inv.used !== null){
    meta.push('<div class="icode-meta">' + T().usedWord + ' ' + inv.used + T().timesWord + '</div>');
  }
  const spent = remainingOf(inv) === 0;
  const foot = '<div class="icode-foot"><span>@' + inv.user + ' · ' + inv.date + '</span>'
    + (inv.url ? '<a href="' + inv.url + '" target="_blank" rel="noopener">' + T().updateUsage + '</a>' : '')
    + '</div>';
  return '<article class="icode random' + (spent ? ' spent' : '') + '">'
    + '<div class="icode-top"><code data-code="' + inv.code + '">' + inv.code + '</code>'
    + '<button class="copybtn" data-code="' + inv.code + '">' + T().copy + '</button></div>'
    + meta.join('')
    + (inv.intro ? '<p class="icode-intro">' + inv.intro + '</p>' : '<div class="icode-intro"></div>')
    + foot + '</article>';
}

/* dedupe, drop owner's code, drop spent ones when filtering */
function communityPool(){
  let list = INVITES.filter(function(i){ return i.code && i.code !== OWNER_CODE; });
  const seen = {};
  list = list.filter(function(i){
    if (seen[i.code]) return false;
    seen[i.code] = true;
    return true;
  });
  if (inviteLeftOnly) list = list.filter(function(i){ return remainingOf(i) !== 0; });
  return list;
}

function renderInvites(reshuffle){
  const pool = communityPool();
  const byCode = {};
  pool.forEach(function(i){ byCode[i.code] = i; });
  const n = Math.min(RANDOM_COUNT, pool.length);

  if (reshuffle || !sampleCodes.length){
    sampleCodes = pickRandom(pool, n).map(function(i){ return i.code; });
  } else {
    sampleCodes = sampleCodes.filter(function(c){ return byCode[c]; }).slice(0, n);
    if (sampleCodes.length < n){
      const rest = pool.filter(function(i){ return sampleCodes.indexOf(i.code) < 0; });
      sampleCodes = sampleCodes.concat(pickRandom(rest, n - sampleCodes.length).map(function(i){ return i.code; }));
    }
  }
  const shown = sampleCodes.map(function(c){ return byCode[c]; }).filter(Boolean);

  const cnt = $("#inviteCount");
  if (cnt) cnt.textContent = T().inviteCount(pool.length + 1) + (pool.length > RANDOM_COUNT ? " · " + T().showingNote : "");

  const grid = $("#inviteGrid");
  if (grid){
    grid.innerHTML = shown.length
      ? shown.map(inviteCardHTML).join("")
      : '<div class="empty">' + T().communityEmpty + '</div>';
    grid.querySelectorAll("[data-code]").forEach(function(el){
      if (el.tagName === "CODE") el.addEventListener("click", function(){ copyCode(el.dataset.code, null); });
    });
    grid.querySelectorAll(".copybtn").forEach(function(btn){
      btn.addEventListener("click", function(){ copyCode(btn.dataset.code, btn); });
    });
  }
  const note = $("#communityNote");
  if (note) note.textContent = shown.length
    ? (pool.length > RANDOM_COUNT ? T().randomNote(shown.length) : T().allCodes(shown.length))
    : "";
}

function copyCode(code, btn){
  const done = function(){
    if (btn){
      const old = btn.textContent;
      btn.textContent = T().copied;
      setTimeout(function(){ btn.textContent = old; }, 1500);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(done);
  } else { done(); }
}

/* ---------- upload my own invite code ---------- */
const CODE_RE = /^[A-Za-z0-9]{4,12}$/;

function submitInviteCode(){
  const codeIn = $("#fCode"), totalIn = $("#fTotal"), introIn = $("#fIntro"), msg = $("#formMsg");
  const code = (codeIn.value || "").trim().toUpperCase();
  const total = (totalIn.value || "").trim();
  const intro = (introIn.value || "").trim();

  codeIn.classList.toggle("bad", !CODE_RE.test(code));
  if (!CODE_RE.test(code)){
    msg.className = "form-msg err";
    msg.textContent = T().submitBad;
    codeIn.focus();
    return;
  }
  if (total && !/^\d{1,3}$/.test(total)){
    msg.className = "form-msg err";
    msg.textContent = T().submitBad;
    totalIn.focus();
    return;
  }
  const body = [
    "### 你的 Muse 邀请码", "", code, "",
    "### 已使用次数", "", "0", "",
    "### 邀请码总名额（如果知道）", "", total || "", "",
    "### 一句话介绍", "", intro || "", ""
  ].join("\n");
  const params = new URLSearchParams({
    template: "share-invite-code.yml",
    title: "[邀请码] " + code,
    labels: "invite-code",
    body: body
  });
  const btn = $("#submitBtn");
  msg.className = "form-msg ok";
  msg.textContent = T().submitOk;
  btn.disabled = true;
  window.open(SUBMIT_URL + "?" + params.toString(), "_blank", "noopener");
  setTimeout(function(){
    btn.disabled = false;
    codeIn.value = ""; totalIn.value = ""; introIn.value = "";
    codeIn.classList.remove("bad");
  }, 1200);
}

/* localize the upload form + community section header */
function renderSubmitForm(){
  const set = function(sel, val){ const el = $(sel); if (el) el.textContent = val; };
  set("#submitTitle", T().submitTitle);
  set("#submitDesc", T().submitDesc);
  const cLab = $("#fCodeLabel"), tLab = $("#fTotalLabel"), iLab = $("#fIntroLabel");
  if (cLab) cLab.innerHTML = T().fCodeLabel;
  if (tLab) tLab.innerHTML = T().fTotalLabel;
  if (iLab) iLab.innerHTML = T().fIntroLabel;
  const cIn = $("#fCode"), tIn = $("#fTotal"), iIn = $("#fIntro");
  if (cIn) cIn.placeholder = T().fCodePh;
  if (tIn) tIn.placeholder = T().fTotalPh;
  if (iIn) iIn.placeholder = T().fIntroPh;
  set("#submitBtn", T().submitBtn);
  set("#communityTitle", T().communityTitle);
  set("#shuffleBtn", T().shuffle);
}


function loadInvites(){
  if (inviteLoaded) return;
  inviteLoaded = true;
  $("#inviteGrid").innerHTML = '<div class="empty">' + T().inviteLoading + '</div>';
  fetch(ISSUES_API, { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(list){
    INVITES = (Array.isArray(list) ? list : [])
      .filter(function(i){ return !i.pull_request; })
      .map(parseInvite);
    renderInvites(true);
  }).catch(function(){
    $("#inviteGrid").innerHTML = '<div class="empty">' + T().inviteFail + '</div>';
    });
}



/* ---------- view switching ---------- */
function switchView(v){
  activeView = v;
  $("#tabCases").classList.toggle("on", v === "cases");
  $("#tabInvite").classList.toggle("on", v === "invite");
  $("#viewCases").hidden = v !== "cases";
  $("#viewInvite").hidden = v !== "invite";
  $("#searchBox").classList.toggle("hidden", v !== "cases");
  if (v === "invite") { renderSubmitForm(); loadInvites(); }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#tabCases").addEventListener("click", () => switchView("cases"));
$("#tabInvite").addEventListener("click", () => switchView("invite"));
$("#langSel").addEventListener("change", e => { lang = e.target.value; applyLang(); });
$("#q").addEventListener("input", render);
$("#loadMore").addEventListener("click", () => { shown += 24; render(); });
$("#inviteLeftOnly").addEventListener("click", () => {
  inviteLeftOnly = !inviteLeftOnly;
  $("#inviteLeftOnly").textContent = inviteLeftOnly ? T().inviteAll : T().inviteLeftOnly;
  $("#inviteLeftOnly").classList.toggle("on", inviteLeftOnly);
  if (inviteLoaded) renderInvites();
});
$("#shuffleBtn").addEventListener("click", () => { renderInvites(true); });
$("#submitBtn").addEventListener("click", submitInviteCode);
["#fCode","#fTotal","#fIntro"].forEach(sel => {
  const el = $(sel);
  if (el) el.addEventListener("input", () => {
    const m = $("#formMsg");
    if (m && m.className.indexOf("ok") >= 0){ m.className = "form-msg"; m.textContent = ""; }
    if (el.classList.contains("bad")) el.classList.remove("bad");
  });
});
["#fCode","#fTotal","#fIntro"].forEach(sel => {
  $(sel).addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submitInviteCode(); } });
});
$("#heroInviteBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(OWNER_CODE).then(() => {
    $("#heroInviteText").textContent = T().heroCopied;
    setTimeout(() => $("#heroInviteText").textContent = T().heroInvite, 1500);
  });
});

/* ---------- theme switcher ---------- */
function currentTheme(){
  return document.documentElement.getAttribute("data-theme") || "dark";
}
function updateThemeUI(theme){
  const sun = document.getElementById("themeIconSun");
  const moon = document.getElementById("themeIconMoon");
  const btn = document.getElementById("themeToggle");
  if (theme === "dark"){
    if (sun) sun.style.display = "block";
    if (moon) moon.style.display = "none";
    if (btn) btn.title = T().themeToLight || "切换到浅色模式";
  } else {
    if (sun) sun.style.display = "none";
    if (moon) moon.style.display = "block";
    if (btn) btn.title = T().themeToDark || "切换到深色模式";
  }
}
function applyTheme(theme){
  const root = document.documentElement;
  root.classList.add("theme-anim");
  root.setAttribute("data-theme", theme);
  try { localStorage.setItem("appstoy-theme", theme); } catch(e){}
  updateThemeUI(theme);
  setTimeout(function(){ root.classList.remove("theme-anim"); }, 260);
}
function toggleTheme(){
  applyTheme(currentTheme() === "dark" ? "light" : "dark");
}
(function initTheme(){
  const btn = document.getElementById("themeToggle");
  if (btn) btn.addEventListener("click", toggleTheme);
  updateThemeUI(currentTheme());
})();

applyLang();
renderSubmitForm();
fetch("cases.json?v=" + Date.now(), { cache: "no-cache" }).then(r => r.json()).then(d => { DATA = d; renderAll(); })
  .catch(() => { $("#grid").innerHTML = `<div class="empty">${T().empty}</div>`; });
</script>
